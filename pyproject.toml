[project]
name = "makcu-engine"
version = "0.6.0"
description = "MAKCU V4 mouse-only engine (Python reference, Rust-portable core)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT OR Apache-2.0"}
authors = [{name = "ForgotMaxime"}]
dependencies = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/ForgotMaxime/MAKCU-ENGINE"
Repository = "https://github.com/ForgotMaxime/MAKCU-ENGINE"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "BLE", "D100", "D101", "D102", "D103"]
ignore = ["D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "E402"]
"examples/*" = ["D100", "D101", "D102", "D103", "E402"]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "serial.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
