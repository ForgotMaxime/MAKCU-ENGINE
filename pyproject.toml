[project]
name = "makcu-engine"
version = "0.1.0"
description = "MAKCU V4 mouse-only engine (Python reference, Rust-portable core)"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
