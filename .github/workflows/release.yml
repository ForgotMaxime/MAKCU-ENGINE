name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypi/gh-action-pypi-publish@release/v1

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Order matters: makcu_serial depends on makcu_core from the index.
      - run: cargo publish -p makcu_core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: for i in $(seq 1 30); do cargo search makcu_core --limit 1 | grep -q makcu_core && break; sleep 20; done
      - run: cargo publish -p makcu_serial --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
